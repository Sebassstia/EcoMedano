${catalogStock === 'out' ? 'active' : ''}`}>Sin stock</button><button type="button" onClick={() => { setCatalogSearch(''); setCatalogCategory('all'); setCatalogDiameter('all'); setCatalogStock('all'); setCatalogSort('featured'); }} className="filter-pill">Limpiar filtros</button></div></div>{filteredProducts.length ? <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">{filteredProducts.map(product => { const outOfStock = product.stock !== '' && Number(product.stock) <= 0; const isManga = product.category === 'manga'; return <article key={product.id} className={`product-card ${outOfStock ? 'opacity-75' : ''}`}><div className="relative overflow-hidden"><div className="absolute z-10 top-3 left-3 flex flex-wrap gap-2"><span className={`badge ${isManga ? 'badge-green' : 'badge-orange'}`}>{isManga ? `MANGA ${product.inches}"` : 'ACCESORIO'}</span>{outOfStock && <span className="badge bg-white text-red-600">SIN STOCK</span>}</div><img src={product.img} alt={product.name} loading="lazy" className={`w-full h-64 object-cover ${!outOfStock ? 'product-image' : 'grayscale'}`} /></div><div className="p-5 md:p-6 flex flex-col min-h-[280px]"><div><div className="flex items-start justify-between gap-3"><h4 className="text-xl font-black leading-tight">{product.name}</h4><span className="text-primary font-black whitespace-nowrap">${Number(product.price || 0).toLocaleString('es-AR')}</span></div>{product.description && <p className="text-sm text-slate-500 mt-2 line-clamp-3">{product.description}</p>}{isManga ? <div className="grid grid-cols-2 gap-2 mt-4"><div className="spec-box"><span>Diámetro</span><strong>{product.inches}"</strong></div><div className="spec-box"><span>Rinde</span><strong>{product.metersPerRoll} m</strong></div><div className="spec-box"><span>Stock</span><strong>{outOfStock ? '0' : product.stock + ' u.'}</strong></div><div className="spec-box"><span>Tipo</span><strong>Manga</strong></div></div> : <div className="spec-box mt-4"><span>Stock</span><strong>{outOfStock ? '0' : product.stock + ' u.'}</strong></div>}</div><div className="grid grid-cols-2 gap-2 mt-5"><button type="button" onClick={() => handleAddToCart(product)} disabled={outOfStock} className="py-3 rounded-xl bg-primary disabled:bg-slate-200 disabled:text-slate-400 text-white font-black"><IconCart className="w-4 h-4 inline-block mr-1" /> Añadir</button><button type="button" onClick={() => { addQuantityToCart(product, 1); setIsCartOpen(true); }} disabled={outOfStock} className="py-3 rounded-xl border border-primary text-primary disabled:border-slate-200 disabled:text-slate-400 font-black">Comprar ahora</button></div><button type="button" onClick={() => handleSmartWhatsApp('product', product)} className="w-full mt-2 py-2.5 rounded-xl bg-[#e9fff0] text-[#15803d] font-black text-sm"><IconWhatsApp className="w-4 h-4 inline-block mr-1" /> Consultar por esta {isManga ? 'manga' : 'pieza'}</button></div></article>; })}</div> : <div className="text-center bg-white rounded-3xl border border-slate-200 py-14 px-6"><h4 className="text-xl font-black">No encontramos productos</h4><p className="text-slate-500 mt-2">Probá quitando algún filtro o buscando otro término.</p></div>}</div></section>

                    <section id="galeria" className="py-16 md:py-20 bg-white px-4 border-t border-slate-100"><div className="max-w-6xl mx-auto"><div className="text-center mb-10"><span className="text-primary font-black uppercase tracking-[0.18em] text-xs">Autenticidad</span><h3 className="text-3xl md:text-4xl font-black mt-2">Directo en el Campo</h3><p className="text-slate-500 max-w-2xl mx-auto mt-2">Nuestros productos trabajando donde más importa: en las fincas de nuestros productores.</p></div><div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-5"><div className="col-span-2 row-span-2 overflow-hidden rounded-3xl relative group"><img src="manga1.png" alt="Instalación en campo" loading="lazy" className="w-full h-full object-cover product-image" /></div><div className="overflow-hidden rounded-3xl h-44 md:h-64"><img src="manga2.png" alt="Cultivo y mangas" loading="lazy" className="w-full h-full object-cover product-image" /></div><div className="overflow-hidden rounded-3xl h-44 md:h-64"><img src="manga3.png" alt="Surcos preparados" loading="lazy" className="w-full h-full object-cover product-image" /></div><div className="col-span-2 aspect-video overflow-hidden rounded-3xl"><video src="video.mp4" autoPlay loop muted playsInline preload="metadata" className="w-full h-full object-cover" /></div></div></div></section>

                    <footer id="contacto" className="bg-[#06150c] text-white pt-14 pb-8 px-4 border-t-4 border-secondary"><div className="max-w-6xl mx-auto grid md:grid-cols-3 gap-10 text-center md:text-left"><div><div className="flex items-center justify-center md:justify-start gap-3 mb-4"><div className="w-10 h-10 rounded-xl overflow-hidden"><img src="logoo.png" alt="Logo Ecomedano" className="w-full h-full object-contain" /></div><h4 className="text-2xl font-black">Ecomedano</h4></div><p className="text-slate-400 text-sm leading-relaxed max-w-sm mx-auto md:mx-0">Tu aliado para un riego eficiente, con atención directa y soluciones pensadas para el productor local.</p></div><div><h4 className="text-sm uppercase tracking-widest font-black mb-4">Contacto</h4><div className="space-y-3 text-slate-400 text-sm"><a href={`tel:+${WHATSAPP_NUMBER}`} className="flex items-center justify-center md:justify-start gap-2 hover:text-white"><IconPhone className="w-4 h-4 text-secondary" /> +54 9 264 404-9545</a><a href="https://www.instagram.com/ecomedano/" target="_blank" rel="noreferrer" className="flex items-center justify-center md:justify-start gap-2 hover:text-white"><IconInstagram className="w-4 h-4 text-secondary" /> Instagram</a><a href="https://www.facebook.com/profile.php?id=61582575624271&locale=es_LA" target="_blank" rel="noreferrer" className="flex items-center justify-center md:justify-start gap-2 hover:text-white"><IconFacebook className="w-4 h-4 text-secondary" /> Facebook</a></div></div><div><h4 className="text-sm uppercase tracking-widest font-black mb-4">Ubicación</h4><a href="https://www.google.com/maps/search/?api=1&query=Ramón+Franco+entre+6+y+7,+Médano+de+Oro,+San+Juan" target="_blank" rel="noreferrer" className="flex items-start justify-center md:justify-start gap-2 text-slate-400 hover:text-white text-sm"><IconMapPin className="w-5 h-5 text-secondary shrink-0" /><span>Ramón Franco entre 6 y 7,<br/>Médano de Oro, San Juan.</span></a></div></div><div className="max-w-6xl mx-auto border-t border-white/10 mt-10 pt-6 flex flex-col sm:flex-row justify-between items-center gap-3 text-xs text-slate-500"><p>&copy; {new Date().getFullYear()} Ecomedano. Todos los derechos reservados.</p><button type="button" onClick={() => setShowAuthModal(true)} className="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white font-bold"><IconSettings className="w-4 h-4 inline-block mr-1" /> Ingreso Admin</button></div></footer>

                    {isCartOpen && <div className="fixed inset-0 z-[65]"><div className="absolute inset-0 bg-slate-950/55 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div><aside className="absolute top-0 right-0 h-full w-full sm:max-w-[540px] bg-white shadow-2xl flex flex-col"><div className="p-5 md:p-6 border-b border-slate-200 flex items-center justify-between"><div><p className="text-xs uppercase tracking-widest text-primary font-black">Pedido</p><h3 className="text-2xl font-black">Tu carrito <span className="text-sm text-slate-400">({totalCartItems})</span></h3></div><button type="button" onClick={() => setIsCartOpen(false)} className="p-2 rounded-full bg-slate-100"><IconClose className="w-5 h-5" /></button></div>{cart.length ? <><div className="flex-1 overflow-y-auto p-5 md:p-6 space-y-4"><div className="space-y-3">{cart.map(item => <div key={item.id} className="rounded-2xl border border-slate-200 p-4"><div className="flex gap-3"><img src={item.img} alt={item.name} className="w-16 h-16 rounded-xl object-cover shrink-0" /><div className="min-w-0 flex-1"><div className="flex justify-between gap-3"><div><h4 className="font-black leading-tight">{item.name}</h4><p className="text-xs text-slate-500">{item.category === 'manga' ? `${item.inches}" · ${item.metersPerRoll} m/rollo` : 'Accesorio'}</p></div><button type="button" onClick={() => removeFromCart(item.id)} className="text-red-500"><IconTrash className="w-4 h-4" /></button></div><div className="flex items-center justify-between mt-3"><div className="flex items-center gap-1 border border-slate-200 rounded-xl p-1"><button type="button" onClick={() => updateCartQuantity(item.id, -1)} className="p-1.5 rounded-lg hover:bg-slate-50"><IconMinus className="w-4 h-4" /></button><span className="w-8 text-center font-black">{item.quantity}</span><button type="button" onClick={() => updateCartQuantity(item.id, 1)} className="p-1.5 rounded-lg hover:bg-slate-50"><IconPlus className="w-4 h-4" /></button></div><span className="font-black text-lg">${(Number(item.price || 0) * Number(item.quantity || 0)).toLocaleString('es-AR')}</span></div></div></div></div>)}</div><div className="rounded-2xl bg-emerald-50 border border-emerald-100 p-4 mt-5"><p className="text-sm font-black text-emerald-800">Metros de manga estimados: {cartMeters} m</p><p className="text-xs text-emerald-700 mt-1">Los accesorios no suman metros.</p></div><div className="mt-6 space-y-3"><h4 className="font-black text-lg">Datos para coordinar</h4><div className="grid grid-cols-1 sm:grid-cols-2 gap-3"><input value={checkoutForm.name} onChange={e => setCheckoutForm({...checkoutForm, name: e.target.value})} className="admin-input" placeholder="Nombre y apellido" /><input value={checkoutForm.phone} onChange={e => setCheckoutForm({...checkoutForm, phone: e.target.value})} className="admin-input" placeholder="Teléfono" inputMode="tel" /><select value={checkoutForm.zone} onChange={e => setCheckoutForm({...checkoutForm, zone: e.target.value})} className="admin-input"><option>Médano de Oro</option><option>Albardón</option><option>Angaco</option><option>Rawson</option><option>Rivadavia</option><option>Santa Lucía</option><option>Pocito</option><option>Sarmiento</option><option>25 de Mayo</option><option>Otros (Consultar)</option></select><input value={checkoutForm.address} onChange={e => setCheckoutForm({...checkoutForm, address: e.target.value})} className="admin-input" placeholder="Dirección / referencia" /></div><select value={checkoutForm.payment} onChange={e => setCheckoutForm({...checkoutForm, payment: e.target.value})} className="admin-input"><option>Efectivo contra entrega</option><option>Transferencia bancaria</option><option>Otro medio a coordinar</option></select><textarea value={checkoutForm.notes} onChange={e => setCheckoutForm({...checkoutForm, notes: e.target.value})} className="admin-input min-h-20 resize-y" placeholder="Observaciones del pedido"></textarea></div></div><div className="p-5 md:p-6 border-t border-slate-200 bg-white"><div className="flex justify-between items-end mb-4"><div><p className="text-xs uppercase tracking-widest text-slate-400 font-black">Total estimado</p><p className="text-3xl font-black">${totalCartPrice.toLocaleString('es-AR')}</p></div><span className="text-xs text-slate-400 max-w-[160px] text-right">La compra se confirma personalmente por WhatsApp.</span></div><button type="button" onClick={handleCheckoutWhatsApp} className="w-full py-4 rounded-2xl bg-[#25D366] hover:bg-[#20bd5a] text-white font-black text-lg shadow-lg flex items-center justify-center gap-2"><IconWhatsApp className="w-6 h-6" /> Enviar pedido por WhatsApp</button></div></> : <div className="flex-1 flex items-center justify-center p-8 text-center"><div><div className="w-16 h-16 rounded-2xl bg-slate-100 mx-auto flex items-center justify-center text-slate-400"><IconCart className="w-7 h-7" /></div><h3 className="text-xl font-black mt-4">Tu carrito está vacío</h3><p className="text-slate-500 mt-2">Agregá productos del catálogo y te armamos el pedido.</p><button type="button" onClick={() => setIsCartOpen(false)} className="mt-5 px-5 py-3 rounded-xl bg-primary text-white font-black">Ver catálogo</button></div></div>}</aside></div>}

                    <button type="button" onClick={() => handleSmartWhatsApp('general')} className={`fixed right-5 bottom-5 md:right-7 md:bottom-7 z-40 w-14 h-14 md:w-16 md:h-16 rounded-full bg-[#25D366] text-white shadow-[0_18px_40px_rgba(37,211,102,.35)] flex items-center justify-center hover:-translate-y-1 transition-transform ${isCartOpen ? 'hidden' : ''}`} title="Asesoramiento por WhatsApp"><IconWhatsApp className="w-7 h-7" /></button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EcomedanoApp />);
    </script>
</body>
</html>
