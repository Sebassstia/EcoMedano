    <!-- React y Babel -->

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        html { scroll-behavior: smooth; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-toast { animation: slideUp 0.3s ease-out forwards; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }


        /* =========================================================
           ECOMEDANO — CAPA VISUAL PROFESIONAL
           Esta capa solo redefine estilos: no modifica la lógica React.
        ========================================================= */
        :root {
            --eco-900: #082f1b;
            --eco-800: #0b4627;
            --eco-700: #166534;
            --eco-600: #15803d;
            --eco-500: #22c55e;
            --eco-400: #4ade80;
            --eco-100: #dcfce7;
            --eco-50: #f0fdf4;
            --ink: #0f172a;
            --muted: #64748b;
            --surface: #ffffff;
            --surface-soft: #f6f9f7;
            --line: rgba(15, 23, 42, .08);
            --shadow-sm: 0 8px 26px rgba(15, 23, 42, .06);
            --shadow-md: 0 18px 48px rgba(15, 23, 42, .10);
            --shadow-lg: 0 28px 70px rgba(15, 23, 42, .14);
        }

        html { scroll-padding-top: 92px; }
        body {
            background: #f5f8f6 !important;
            color: var(--ink) !important;
            letter-spacing: -0.008em;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }
        ::selection { background: rgba(34,197,94,.25) !important; color: #06351d !important; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #eef3ef; }
        ::-webkit-scrollbar-thumb { background: #b8cabe; border-radius: 999px; border: 2px solid #eef3ef; }
        ::-webkit-scrollbar-thumb:hover { background: #7fa18a; }

        /* Microinteracciones globales */
        button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 3px solid rgba(34,197,94,.28) !important;
            outline-offset: 2px;
        }
        img { image-rendering: auto; }

        /* HEADER PÚBLICO */
        header.fixed {
            transition: background .35s ease, box-shadow .35s ease, padding .35s ease, border-color .35s ease !important;
        }
        header.fixed > div {
            max-width: 1180px !important;
        }
        header.fixed .group img {
            filter: drop-shadow(0 6px 14px rgba(0,0,0,.10));
        }
        header.fixed nav a {
            position: relative;
            letter-spacing: .005em;
        }
        header.fixed nav a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -7px;
            height: 2px;
            border-radius: 999px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: center;
            transition: transform .25s ease;
            opacity: .75;
        }
        header.fixed nav a:hover::after { transform: scaleX(1); }
        header.fixed button {
            box-shadow: 0 8px 24px rgba(15,23,42,.08);
        }
        header.fixed .bg-white\/95 {
            box-shadow: 0 14px 35px rgba(15,23,42,.08) !important;
        }

        /* HERO */
        #inicio {
            min-height: 760px !important;
            background-position: center !important;
            isolation: isolate;
            overflow: hidden;
        }
        #inicio::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(circle at 76% 26%, rgba(74,222,128,.18), transparent 32%),
                radial-gradient(circle at 17% 78%, rgba(20,83,45,.30), transparent 38%);
            pointer-events: none;
        }
        #inicio > .absolute.inset-0 {
            background: linear-gradient(180deg, rgba(3,18,10,.76) 0%, rgba(5,37,21,.52) 44%, rgba(10,75,38,.78) 100%) !important;
        }
        #inicio .relative.z-10 {
            max-width: 980px !important;
            text-shadow: 0 3px 20px rgba(0,0,0,.20);
        }
        #inicio h2 {
            font-size: clamp(2.65rem, 5.6vw, 5.9rem) !important;
            line-height: .98 !important;
            letter-spacing: -.055em !important;
            text-wrap: balance;
            margin-bottom: 28px !important;
        }
        #inicio p {
            max-width: 760px !important;
            font-size: clamp(1.05rem, 1.7vw, 1.45rem) !important;
            color: rgba(255,255,255,.84) !important;
        }
        #inicio a:not([href*="google"]) {
            min-height: 56px;
            padding-inline: 30px !important;
            border: 1px solid rgba(255,255,255,.16);
            box-shadow: 0 18px 44px rgba(34,197,94,.26), inset 0 1px 0 rgba(255,255,255,.15) !important;
        }
        #inicio a[href*="google"] {
            background: rgba(255,255,255,.10) !important;
            border-color: rgba(255,255,255,.24) !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.13), 0 10px 32px rgba(0,0,0,.10) !important;
        }

        /* SECCIONES */
        #calculadora, #productos, section#galeria {
            position: relative;
        }
        #calculadora > div > div {
            border: 1px solid rgba(15,23,42,.07) !important;
            box-shadow: var(--shadow-md) !important;
            border-radius: 28px !important;
            overflow: hidden;
            position: relative;
        }
        #calculadora > div > div::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 5px;
            background: linear-gradient(90deg, #14532d, #22c55e, #86efac);
        }
        #calculadora .w-16.h-16 {
            box-shadow: 0 12px 28px rgba(34,197,94,.15);
            border: 1px solid #d1fae5;
        }
        #calculadora input, #calculadora button {
            box-shadow: none;
        }
        #calculadora input {
            background: #f8fbf9 !important;
            border-color: #dfe8e2 !important;
            min-height: 58px;
        }
        #calculadora input:hover { border-color: #bfd4c5 !important; }
        #calculadora input:focus {
            background: #fff !important;
            border-color: #22c55e !important;
            box-shadow: 0 0 0 4px rgba(34,197,94,.10) !important;
        }
        #calculadora .bg-gray-50.rounded-2xl {
            background: linear-gradient(145deg, #f8fbf9, #f0f7f2) !important;
            border-color: #dfeae2 !important;
        }

        /* DESTACADOS */
        #productos ~ section .bg-white.rounded-2xl,
        #productos + section .bg-white.rounded-2xl {
            box-shadow: var(--shadow-sm) !important;
            border: 1px solid rgba(217,119,6,.13) !important;
        }
        #productos + section .bg-white.rounded-2xl:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md) !important;
        }

        /* CATÁLOGO */
        #productos {
            background:
                radial-gradient(circle at 5% 15%, rgba(34,197,94,.055), transparent 23%),
                radial-gradient(circle at 92% 84%, rgba(34,197,94,.045), transparent 25%),
                #f5f8f6 !important;
        }
        #productos .grid > div {
            border-radius: 26px !important;
            border-color: rgba(15,23,42,.07) !important;
            box-shadow: var(--shadow-sm) !important;
            background: #fff !important;
            overflow: hidden;
        }
        #productos .grid > div:hover {
            box-shadow: var(--shadow-lg) !important;
            transform: translateY(-8px) !important;
            border-color: rgba(34,197,94,.20) !important;
        }
        #productos .grid > div .h-64 {
            height: 290px !important;
            background: #edf3ef;
        }
        #productos .grid > div .h-64 img {
            transition: transform .8s cubic-bezier(.2,.7,.2,1), filter .45s ease !important;
        }
        #productos .grid > div:hover .h-64 img {
            transform: scale(1.055);
        }
        #productos .grid > div > .p-6,
        #productos .grid > div > .md\:p-8 {
            background: linear-gradient(180deg, #fff 0%, #fbfdfb 100%) !important;
        }
        #productos h4 {
            letter-spacing: -.028em !important;
        }
        #productos .text-3xl {
            letter-spacing: -.035em;
        }
        #productos .grid > div button {
            min-height: 54px;
            border-radius: 15px !important;
            font-size: .98rem;
        }
        #productos .grid > div button:not(:disabled) {
            background: #f8fbf9 !important;
            border-color: #dce7df !important;
        }
        #productos .grid > div:hover button:not(:disabled) {
            background: #166534 !important;
            border-color: #166534 !important;
            color: #fff !important;
        }

        /* GALERÍA */
        #galeria {
            background: #fff !important;
        }
        #galeria > div {
            max-width: 1180px !important;
        }
        #galeria .grid > div {
            border-radius: 24px !important;
            border: 1px solid rgba(15,23,42,.06);
            box-shadow: var(--shadow-sm);
        }
        #galeria .grid > div img,
        #galeria .grid > div video {
            filter: saturate(.96) contrast(1.02);
        }
        #galeria .grid > div:hover {
            box-shadow: var(--shadow-md);
        }

        /* CARRITO */
        body > #root .fixed.inset-0.z-50 > .bg-white.w-full.md\:w\-\[420px\] {
            box-shadow: -24px 0 70px rgba(15,23,42,.20) !important;
            border-left: 1px solid rgba(15,23,42,.08);
        }
        body > #root .fixed.inset-0.z-50 > .bg-white.w-full.md\:w\-\[420px\] > div:first-child {
            background: linear-gradient(180deg, #fff, #f7faf8) !important;
            border-bottom-color: #e4ebe6 !important;
        }
        body > #root .fixed.inset-0.z-50 > .bg-white.w-full.md\:w\-\[420px\] .rounded-2xl {
            border-color: #e3eae5 !important;
        }
        body > #root .fixed.inset-0.z-50 > .bg-white.w-full.md\:w\-\[420px\] input,
        body > #root .fixed.inset-0.z-50 > .bg-white.w-full.md\:w\-\[420px\] select {
            min-height: 52px;
            background: #fbfdfb !important;
        }
        body > #root .fixed.inset-0.z-50 > .bg-white.w-full.md\:w\-\[420px\] input:focus,
        body > #root .fixed.inset-0.z-50 > .bg-white.w-full.md\:w\-\[420px\] select:focus {
            border-color: #22c55e !important;
            box-shadow: 0 0 0 4px rgba(34,197,94,.10) !important;
        }

        /* MODALES */
        .fixed.inset-0.z-50 > .bg-white.rounded-3xl,
        .fixed.inset-0.z-50 > .bg-white.rounded-3xl.p-8 {
            border: 1px solid rgba(15,23,42,.08);
            box-shadow: 0 32px 90px rgba(15,23,42,.25) !important;
        }
        .fixed.inset-0.z-50 > .absolute.bg-dark\/80,
        .fixed.inset-0.z-50 > .bg-dark\/60 {
            background: rgba(3, 15, 9, .68) !important;
            backdrop-filter: blur(8px) !important;
        }

        /* TOAST */
        .animate-toast {
            box-shadow: 0 18px 50px rgba(15,23,42,.22) !important;
            border: 1px solid rgba(255,255,255,.15);
        }

        /* FOOTER */
        footer#contacto {
            background:
                radial-gradient(circle at 15% 10%, rgba(34,197,94,.09), transparent 28%),
                linear-gradient(180deg, #071b10 0%, #06150c 100%) !important;
        }
        footer#contacto .max-w-6xl {
            max-width: 1180px !important;
        }
        footer#contacto a:hover { transform: translateX(2px); }
        footer#contacto .border-t { border-color: rgba(255,255,255,.09) !important; }

        /* PANEL ADMIN */
        .min-h-screen.bg-gray-50 {
            background:
                radial-gradient(circle at 0 0, rgba(34,197,94,.055), transparent 28%),
                #f5f7f6 !important;
        }
        .min-h-screen.bg-gray-50 > header.bg-dark {
            background: linear-gradient(135deg, #06190e 0%, #0b3d22 55%, #14532d 100%) !important;
            box-shadow: 0 16px 35px rgba(3,18,10,.18) !important;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .min-h-screen.bg-gray-50 > header .max-w-6xl {
            max-width: 1180px !important;
        }
        .min-h-screen.bg-gray-50 .shadow-soft {
            box-shadow: var(--shadow-sm) !important;
        }
        .min-h-screen.bg-gray-50 .bg-white.rounded-2xl,
        .min-h-screen.bg-gray-50 .bg-white.rounded-3xl {
            border-color: rgba(15,23,42,.07) !important;
        }
        .min-h-screen.bg-gray-50 .bg-white.rounded-2xl:hover {
            box-shadow: var(--shadow-md) !important;
        }
        .min-h-screen.bg-gray-50 input,
        .min-h-screen.bg-gray-50 textarea,
        .min-h-screen.bg-gray-50 select {
            border-color: #d8e2dc !important;
            background: #fbfdfc;
        }
        .min-h-screen.bg-gray-50 input:focus,
        .min-h-screen.bg-gray-50 textarea:focus,
        .min-h-screen.bg-gray-50 select:focus {
            border-color: #22c55e !important;
            box-shadow: 0 0 0 4px rgba(34,197,94,.10) !important;
        }
        .min-h-screen.bg-gray-50 .space-y-4 > div {
            border-color: #e3e9e5 !important;
        }
        .min-h-screen.bg-gray-50 .space-y-4 > div:hover {
            border-color: rgba(34,197,94,.20) !important;
        }

        /* BOTONES VERDES PRINCIPALES */
        .bg-primary:not(input), .bg-secondary:not(input) {
            box-shadow: 0 10px 26px rgba(22,101,52,.16);
        }
        .bg-primary:hover, .bg-secondary:hover {
            filter: saturate(1.04) brightness(1.02);
        }

        /* MOBILE */
        @media (max-width: 1024px) {
            header.fixed nav { display: none; }
        }
        @media (max-width: 768px) {
            #inicio {
                min-height: 690px !important;
                padding-top: 120px !important;
                padding-bottom: 110px !important;
            }
            #inicio h2 {
                font-size: clamp(2.45rem, 11vw, 4rem) !important;
                line-height: 1.02 !important;
            }
            #inicio p { font-size: 1.05rem !important; }
            #calculadora > div > div { border-radius: 24px !important; }
            #calculadora { margin-top: -22px !important; }
            #productos .grid > div .h-64 { height: 250px !important; }
            #galeria .grid { gap: 12px !important; }
            #galeria .grid > div { border-radius: 18px !important; }
            footer#contacto { padding-top: 54px !important; }
        }
        @media (max-width: 480px) {
            header.fixed .w-10.h-10 { width: 38px !important; height: 38px !important; }
            header.fixed h1 { font-size: 1.12rem !important; }
            #inicio a:not([href*="google"]) { width: 100%; justify-content: center; }
            #calculadora > div > div { padding: 24px !important; }
            #productos .grid > div { border-radius: 22px !important; }
            #productos .grid > div > .p-6 { padding: 22px !important; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }


        /* =========================================================
           ECOMEDANO — REFINAMIENTO VISUAL PROFESIONAL v2
           Solo mejora presentación, interacción y responsive.
           La estructura y la lógica existente se conservan.
        ========================================================= */
        :root {
            --eco-accent: #a7f3d0;
            --eco-border: rgba(15, 23, 42, .075);
            --eco-focus: rgba(34, 197, 94, .18);
            --eco-radius: 20px;
        }

        * { box-sizing: border-box; }

        body {
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        ::selection {
            background: rgba(22, 101, 52, .18) !important;
            color: #082f1b !important;
        }

        a, button {
            transition-property: color, background-color, border-color, box-shadow, transform, opacity, filter;
            transition-duration: .22s;
            transition-timing-function: cubic-bezier(.22, 1, .36, 1);
        }

        button:not(:disabled):active,
        a:active { transform: translateY(1px); }

        button:disabled { cursor: not-allowed; }

        /* HEADER */
        header.fixed {
            background: rgba(255,255,255,.84);
            -webkit-backdrop-filter: blur(18px) saturate(150%);
            backdrop-filter: blur(18px) saturate(150%);
        }

        header.fixed:not(.bg-white\/95) {
            background: transparent;
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
        }

        header.fixed .group {
            transition: transform .25s ease;
        }

        header.fixed .group:hover { transform: translateY(-1px); }

        header.fixed .group > div:first-child {
            border: 1px solid rgba(255,255,255,.18);
            box-shadow: 0 8px 22px rgba(0,0,0,.08);
        }

        header.fixed .bg-white\/95 .group > div:first-child {
            border-color: rgba(15,23,42,.06);
        }

        header.fixed nav {
            align-items: center;
            gap: 1.9rem !important;
        }

        header.fixed nav a {
            padding: .45rem 0;
            font-weight: 650;
        }

        header.fixed button {
            min-width: 46px;
            min-height: 46px;
        }


        /* Ajuste final del logo del encabezado: limpio, sin marco ni tarjeta */
        header.fixed .group > div:first-child {
            border: 0 !important;
            box-shadow: none !important;
            background: transparent !important;
            border-radius: 0 !important;
        }

        header.fixed .group > div:first-child img {
            filter: drop-shadow(0 2px 5px rgba(0,0,0,.10));
        }

        header.fixed:not(.bg-white\\/95) .group > div:first-child img {
            filter: drop-shadow(0 2px 6px rgba(0,0,0,.20));
        }

        /* MENÚ MÓVIL */
        header.fixed .lg\:hidden.absolute {
            border-bottom-left-radius: 22px;
            border-bottom-right-radius: 22px;
            box-shadow: 0 24px 55px rgba(15,23,42,.14) !important;
            padding-top: 8px;
            padding-bottom: 10px;
        }

        header.fixed .lg\:hidden.absolute a {
            border-radius: 14px;
            margin: 2px 0;
            border-bottom: 0;
            padding: 14px 15px;
        }

        header.fixed .lg\:hidden.absolute a:hover {
            background: #f0fdf4;
            padding-left: 18px;
        }

        /* HERO */
        #inicio {
            box-shadow: inset 0 -1px 0 rgba(255,255,255,.12);
        }

        #inicio .relative.z-10 {
            animation: ecoHeroIn .75s cubic-bezier(.22,1,.36,1) both;
        }

        #inicio a {
            border-radius: 15px !important;
        }

        #inicio a:hover {
            box-shadow: 0 20px 45px rgba(0,0,0,.18), 0 8px 26px rgba(34,197,94,.18) !important;
        }

        @keyframes ecoHeroIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CABECERAS DE SECCIÓN */
        #productos > div > div:first-child,
        #galeria > div > div:first-child {
            position: relative;
        }


        /* CALCULADORA */
        #calculadora > div > div {
            background:
                radial-gradient(circle at 100% 0, rgba(74,222,128,.07), transparent 30%),
                #fff !important;
        }

        #calculadora .flex.flex-wrap button {
            min-height: 50px;
            border-radius: 14px !important;
        }

        #calculadora .flex.flex-wrap button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(22,101,52,.10);
        }

        #calculadora input {
            border-radius: 14px !important;
            font-size: 1rem;
        }

        #calculadora .bg-gray-50.rounded-2xl {
            border-radius: 20px !important;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
        }

            const [adminSessionStarted, setAdminSessionStarted] = useState(0);

            // =========================
            // PRODUCTOS Y CONFIGURACIÓN
            // =========================
            const defaultProducts = [
                { id: 1, category: 'manga', name: 'Manga de Riego 4"', description: 'Manga de polietileno de alta densidad ideal para riegos eficientes. Tratamiento UV incluido.', inches: '4', metersPerRoll: 100, price: 15000, stock: 50, img: 'https://images.unsplash.com/photo-1590680415392-7d2d0b556f84?auto=format&fit=crop&w=900&q=80', clicks: 0, isHidden: false },
                { id: 2, category: 'manga', name: 'Manga de Riego 6"', description: 'Mayor caudal para cultivos extensivos. Resistente a arrastres y exposición solar.', inches: '6', metersPerRoll: 50, price: 22000, stock: 30, img: 'https://images.unsplash.com/photo-1589939705384-5185137a7f0f?auto=format&fit=crop&w=900&q=80', clicks: 0, isHidden: false },
                { id: 3, category: 'manga', name: 'Manga de Riego 8"', description: 'Máximo rendimiento para grandes superficies y terrenos desnivelados.', inches: '8', metersPerRoll: 50, price: 30000, stock: 15, img: 'https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=900&q=80', clicks: 0, isHidden: false }
            ];

            const [products, setProducts] = useState([]);
            const [showBestSellers, setShowBestSellers] = useState(true);
            const [showCalculator, setShowCalculator] = useState(true);
            const [showWhy, setShowWhy] = useState(true);
            const [isCloudLoaded, setIsCloudLoaded] = useState(false);
            const [cloudStatus, setCloudStatus] = useState('connecting');
            const [cloudError, setCloudError] = useState('');
            const [adminPin, setAdminPin] = useState('1243');

            // =========================================================
            // FIRESTORE — FUENTE DE VERDAD Y SINCRONIZACIÓN EN TIEMPO REAL
            // =========================================================
            // Conservamos el documento existente `tienda/inventario` para
            // no depender de nuevas rutas que podrían quedar bloqueadas por
            // las reglas actuales de Firebase.
            const cloudInventoryRef = db.collection('tienda').doc('inventario');
            const localProductsKey = 'ecomedano_products_v6';
            const localSettingsKeys = {
                showBestSellers: 'ecomedano_show_best',
                showCalculator: 'ecomedano_show_calculator',
                showWhy: 'ecomedano_show_why'
            };

            const getLocalProducts = () => {
                try {
                    const savedProducts = localStorage.getItem(localProductsKey);
                    if (savedProducts) return JSON.parse(savedProducts);
                    const oldProducts = localStorage.getItem('ecomedano_products_v5') || localStorage.getItem('ecomedano_products_v4') || localStorage.getItem('ecomedano_products_v3');
                    if (oldProducts) {
                        return JSON.parse(oldProducts).map(p => ({
                            ...p,
                            category: p.category || 'manga',
                            inches: p.category === 'otro' ? (p.inches || '') : (p.inches || '4'),
                            stock: p.stock !== undefined ? p.stock : 20,
                            metersPerRoll: p.category === 'otro' ? (p.metersPerRoll || 0) : (p.metersPerRoll || 50),
                            isHidden: !!p.isHidden,
                            clicks: Number(p.clicks || 0)
                        }));
                    }
                    return defaultProducts;
                } catch (error) {
                    console.error('Error leyendo productos locales:', error);
                    return defaultProducts;
                }
            };

            const getLocalConfig = () => ({
                showBestSellers: localStorage.getItem(localSettingsKeys.showBestSellers) !== 'false',
                showCalculator: localStorage.getItem(localSettingsKeys.showCalculator) !== 'false',
                showWhy: localStorage.getItem(localSettingsKeys.showWhy) !== 'false'
            });

            const normalizeCloudProduct = (product) => ({
                ...product,
                id: Number(product.id) || product.id,
                category: product.category || 'manga',
                name: String(product.name || ''),
                description: String(product.description || ''),
                price: Number(product.price || 0),
                stock: product.stock === '' ? '' : Math.max(0, Number(product.stock || 0)),
                inches: product.category === 'manga' ? String(product.inches || '') : '',
                metersPerRoll: product.category === 'manga' ? Number(product.metersPerRoll || 0) : 0,
                clicks: Number(product.clicks || 0),
                isHidden: !!product.isHidden
            });

            const productsArrayToMap = (items) => {
                const map = {};
                (Array.isArray(items) ? items : []).forEach(product => {
                    const normalized = normalizeCloudProduct(product);
                    map[String(normalized.id)] = normalized;
                });
                return map;
            };

            const productsMapToArray = (map) => Object.values(map || {})
                .map(normalizeCloudProduct)
                .sort((a, b) => Number(a.id) - Number(b.id));

            const setLocalProducts = (items) => {
                try { localStorage.setItem(localProductsKey, JSON.stringify(items)); } catch (e) { console.warn('No se pudo guardar respaldo local:', e); }
            };

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll, { passive: true });
                handleScroll();
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                document.body.style.overflow = (isCartOpen || showAuthModal) ? 'hidden' : 'unset';
                return () => { document.body.style.overflow = 'unset'; };
            }, [isCartOpen, showAuthModal]);

            useEffect(() => {
                if (!adminSessionStarted) return undefined;
                const interval = setInterval(() => {
                    if (Date.now() - adminSessionStarted > 30 * 60 * 1000) {
                        setIsAdminMode(false);
                        setAdminSessionStarted(0);
                        showToast('Sesión administrativa cerrada por seguridad.');
                    }
                }, 30000);
                return () => clearInterval(interval);
            }, [adminSessionStarted]);

            const showToast = (message) => {
                setToastMsg(message);
                window.clearTimeout(showToast._timer);
                showToast._timer = window.setTimeout(() => setToastMsg(null), 3200);
            };

            useEffect(() => {
                const localCfg = getLocalConfig();
                const localProducts = getLocalProducts();

                if (!firebaseConfig.apiKey || firebaseConfig.apiKey === 'TU_API_KEY') {
                    setProducts(localProducts);
                    setShowBestSellers(localCfg.showBestSellers);
                    setShowCalculator(localCfg.showCalculator);
                    setShowWhy(localCfg.showWhy);
                    try { setAdminPin(localStorage.getItem('ecomedano_admin_pin') || '1243'); } catch {}
                    setCloudStatus('local');
                    setCloudError('Firebase no está configurado.');
                    setIsCloudLoaded(true);
                    return undefined;
                }

                let disposed = false;

                // Escucha ÚNICA y permanente. No hay ventanas de exclusión ni
                // debounce: cada cambio de Firestore actualiza React al llegar.
                const unsubscribe = cloudInventoryRef.onSnapshot(async (doc) => {
                    if (disposed) return;
                    try {
                        const data = doc.exists ? (doc.data() || {}) : {};
                        let nextProducts = [];

                        if (data.productosPorId && typeof data.productosPorId === 'object') {
                            nextProducts = productsMapToArray(data.productosPorId);
                        } else if (Array.isArray(data.productos)) {
                            // Compatibilidad con la estructura antigua.
                            nextProducts = data.productos.map(normalizeCloudProduct);
                        } else {
                            nextProducts = [];
                        }

                        if (doc.exists && nextProducts.length) {
                            setProducts(nextProducts);
                            setLocalProducts(nextProducts);
                        }

                        setShowBestSellers(data.showBestSellers !== undefined ? !!data.showBestSellers : localCfg.showBestSellers);
                        setShowCalculator(data.showCalculator !== undefined ? !!data.showCalculator : localCfg.showCalculator);
                        setShowWhy(data.showWhy !== undefined ? !!data.showWhy : localCfg.showWhy);
                        if (data.adminPin) {
                            setAdminPin(String(data.adminPin));
                            try { localStorage.setItem('ecomedano_admin_pin', String(data.adminPin)); } catch {}
                        }

                        if (doc.exists && !data.productosPorId && Array.isArray(data.productos)) {
                            // Migración de lectura -> mapa granular, una sola vez.
                            const productsMap = productsArrayToMap(data.productos);
                            await cloudInventoryRef.set({
                                productosPorId: productsMap,
                                schemaVersion: 2,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            }, { merge: true });
                        }

                        if (!doc.exists) {
                            // Inicialización desde los datos existentes/locales.
                            const sourceProducts = localProducts.length ? localProducts : defaultProducts;
                            const productsMap = productsArrayToMap(sourceProducts);
                            await cloudInventoryRef.set({
                                productosPorId: productsMap,
                                schemaVersion: 2,
                                showBestSellers: localCfg.showBestSellers,
                                showCalculator: localCfg.showCalculator,
                                showWhy: localCfg.showWhy,
                                adminPin: (() => { try { return localStorage.getItem('ecomedano_admin_pin') || '1243'; } catch { return '1243'; } })(),
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            }, { merge: true });
                            setProducts(sourceProducts.map(normalizeCloudProduct));
                            setLocalProducts(sourceProducts);
                        }

                        setCloudStatus('online');
                        setCloudError('');
                        setIsCloudLoaded(true);
                    } catch (error) {
                        console.error('Error procesando snapshot de Firestore:', error);
                        setCloudStatus('error');
                        setCloudError(error?.message || 'Error procesando datos de Firebase.');
                        setIsCloudLoaded(true);
                    }
                }, (error) => {
                    console.error('Firestore onSnapshot error:', error);
                    setCloudStatus(error?.code === 'permission-denied' ? 'permission-denied' : 'error');
                    setCloudError(error?.message || 'Firebase no pudo abrir la sincronización en tiempo real.');
                    // IMPORTANTE: no sustituimos la nube por local cuando Firebase
                    // está configurado. Eso ocultaba el fallo y hacía parecer que
                    // el cambio se guardaba cuando en realidad no salía del equipo.
                    setProducts(prev => prev.length ? prev : localProducts);
                    setShowBestSellers(prev => prev);
                    setShowCalculator(prev => prev);
                    setShowWhy(prev => prev);
                    setIsCloudLoaded(true);
                    showToast(error?.code === 'permission-denied'
                        ? 'Firebase rechazó el acceso. Revisá las reglas de Firestore.'
                        : 'Se perdió la conexión con Firebase.');
                });

                return () => {
                    disposed = true;
                    unsubscribe();
                };
            }, []);

            // =========================================================
            // ESCRITURAS GRANULARES — CADA MODIFICACIÓN VA A FIRESTORE
            // =========================================================
            const writeInventoryFields = async (fields) => {
                if (!firebaseConfig.apiKey || firebaseConfig.apiKey === 'TU_API_KEY') return false;
                try {
                    await cloudInventoryRef.update({
                        ...fields,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setCloudStatus('online');
                    setCloudError('');
                    return true;
                } catch (error) {
                    console.error('Error escribiendo Firestore:', error);
                    setCloudStatus(error?.code === 'permission-denied' ? 'permission-denied' : 'error');
                    setCloudError(error?.message || 'No se pudo escribir en Firebase.');
                    showToast(error?.code === 'permission-denied'
                        ? 'Firebase rechazó la escritura. Revisá las reglas de Firestore.'
                        : 'No se pudo sincronizar con Firebase.');
                    return false;
                }
            };

            const writeProductPatch = async (id, patch) => {
                const cleanPatch = { ...patch };
                delete cleanPatch.id;
                const fields = {};
                Object.entries(cleanPatch).forEach(([key, value]) => {
                    fields[`productosPorId.${String(id)}.${key}`] = value;
                });
                return writeInventoryFields(fields);
            };

            const writeProductCreate = async (product) => {
                return writeInventoryFields({
                    [`productosPorId.${String(product.id)}`]: normalizeCloudProduct(product),
                    schemaVersion: 2
                });
            };

            const writeProductDelete = async (id) => {
                if (!firebaseConfig.apiKey || firebaseConfig.apiKey === 'TU_API_KEY') return true;
                try {
                    await cloudInventoryRef.update({
                        [`productosPorId.${String(id)}`]: firebase.firestore.FieldValue.delete(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    return true;
                } catch (error) {
                    console.error(`Error eliminando producto ${id}:`, error);
                    setCloudStatus(error?.code === 'permission-denied' ? 'permission-denied' : 'error');
                    setCloudError(error?.message || 'No se pudo eliminar el producto de Firebase.');
                    showToast('No se pudo eliminar el producto en Firebase.');
                    return false;
                }
            };

            const updateLocalProduct = (id, patch) => {
                setProducts(prev => {
                    const next = prev.map(product => product.id === id ? { ...product, ...patch } : product);
                    setLocalProducts(next);
                    return next;
                });
            };

            const persistSetting = (key, value, storageKey, setter) => {
                const safeValue = !!value;
                setter(safeValue);
                try { localStorage.setItem(storageKey, String(safeValue)); } catch (e) { console.error(e); }
                writeInventoryFields({ [key]: safeValue });
            };

            const toggleBest = () => persistSetting('showBestSellers', !showBestSellers, localSettingsKeys.showBestSellers, setShowBestSellers);
            const toggleCalculator = () => persistSetting('showCalculator', !showCalculator, localSettingsKeys.showCalculator, setShowCalculator);
            const toggleWhy = () => persistSetting('showWhy', !showWhy, localSettingsKeys.showWhy, setShowWhy);

            // =========================
            // CATÁLOGO Y FILTROS
            // =========================
            const visibleProducts = useMemo(() => products.filter(p => !p.isHidden), [products]);
            const mangasOnly = useMemo(() => visibleProducts.filter(p => p.category === 'manga'), [visibleProducts]);
            const availableInches = useMemo(() => [...new Set(mangasOnly.map(p => p.inches).filter(Boolean))].sort((a, b) => Number(a) - Number(b)), [mangasOnly]);
            const [catalogSearch, setCatalogSearch] = useState('');
            const [catalogCategory, setCatalogCategory] = useState('all');
            const [catalogDiameter, setCatalogDiameter] = useState('all');
            const [catalogStock, setCatalogStock] = useState('all');
            const [catalogSort, setCatalogSort] = useState('featured');

            const filteredProducts = useMemo(() => {
                const query = catalogSearch.trim().toLowerCase();
                const result = visibleProducts.filter(p => {
                    const matchesSearch = !query || [p.name, p.description, p.category, p.inches].filter(Boolean).join(' ').toLowerCase().includes(query);
                    const matchesCategory = catalogCategory === 'all' || p.category === catalogCategory;
                    const matchesDiameter = catalogDiameter === 'all' || (p.category === 'manga' && String(p.inches) === String(catalogDiameter));
                    const available = !(p.stock !== '' && Number(p.stock) <= 0);
                    const matchesStock = catalogStock === 'all' || (catalogStock === 'available' ? available : !available);
                    return matchesSearch && matchesCategory && matchesDiameter && matchesStock;
                });
                return result.sort((a, b) => {
                    if (catalogSort === 'priceAsc') return Number(a.price || 0) - Number(b.price || 0);
                    if (catalogSort === 'priceDesc') return Number(b.price || 0) - Number(a.price || 0);
                    if (catalogSort === 'name') return String(a.name || '').localeCompare(String(b.name || ''), 'es');
                    if (catalogSort === 'popular') return Number(b.clicks || 0) - Number(a.clicks || 0);
                    return Number(a.id) - Number(b.id);
                });
            }, [visibleProducts, catalogSearch, catalogCategory, catalogDiameter, catalogStock, catalogSort]);

            // =========================
            // CALCULADORA
            // =========================
            const [calcMeters, setCalcMeters] = useState('');
            const [calcDiameter, setCalcDiameter] = useState(availableInches[0] || '');
            useEffect(() => {
                if (availableInches.length && !availableInches.includes(calcDiameter)) setCalcDiameter(availableInches[0]);
                if (!availableInches.length) setCalcDiameter('');
            }, [availableInches, calcDiameter]);

            const calcSuggestedProduct = useMemo(() => {
                const exact = mangasOnly.filter(p => String(p.inches) === String(calcDiameter));
                return exact.find(p => p.stock === '' || Number(p.stock) > 0) || exact[0] || null;
            }, [mangasOnly, calcDiameter]);
            const numericCalcMeters = Math.max(0, Number(calcMeters) || 0);
            const rollYield = Math.max(1, Number(calcSuggestedProduct?.metersPerRoll) || 50);
            const calcRollsNeeded = numericCalcMeters > 0 && calcSuggestedProduct ? Math.ceil(numericCalcMeters / rollYield) : 0;
            const calcCoveredMeters = calcRollsNeeded * rollYield;
            const calcTotal = calcSuggestedProduct ? calcRollsNeeded * Number(calcSuggestedProduct.price || 0) : 0;

            const addQuantityToCart = (product, quantity) => {
                const safeQty = Math.max(1, Math.floor(Number(quantity) || 1));
                if (!product) return;
                if (product.stock !== '' && safeQty > Number(product.stock)) {
                    showToast(`Stock insuficiente. Solo quedan ${product.stock} unidades.`);
                    return;
                }
                const existing = cart.find(item => item.id === product.id);
                const currentQty = existing ? Number(existing.quantity) : 0;
                if (product.stock !== '' && currentQty + safeQty > Number(product.stock)) {
                    showToast(`Stock insuficiente. Solo quedan ${product.stock} unidades.`);
                    return;
                }
                setCart(prev => existing
                    ? prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + safeQty } : item)
                    : [...prev, { ...product, quantity: safeQty }]
                );
                const nextClicks = Number(product.clicks || 0) + 1;
                updateLocalProduct(product.id, { clicks: nextClicks });
                if (firebaseConfig.apiKey && firebaseConfig.apiKey !== 'TU_API_KEY') {
                    cloudInventoryRef.update({
                        [`productosPorId.${String(product.id)}.clicks`]: firebase.firestore.FieldValue.increment(1),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).catch(e => {
                        console.error('Error registrando interacción:', e);
                        setCloudStatus(e?.code === 'permission-denied' ? 'permission-denied' : 'error');
                        setCloudError(e?.message || 'No se pudo registrar la interacción.');
                    });
                }
                showToast(`Agregaste ${safeQty} ${product.category === 'manga' ? 'rollo(s)' : 'unidad(es)'} de ${product.name}`);
            };

            const handleAddToCart = (product) => addQuantityToCart(product, 1);
            const handleAddCalcToCart = () => {
                if (!calcSuggestedProduct || !calcRollsNeeded) {
                    showToast('Ingresa los metros y selecciona una manga disponible.');
                    return;
                }
                addQuantityToCart(calcSuggestedProduct, calcRollsNeeded);
            };

            // =========================
            // CARRITO Y CHECKOUT
            // =========================
            const [checkoutForm, setCheckoutForm] = useState({
                name: '', phone: '', zone: 'Médano de Oro', address: '', payment: 'Efectivo contra entrega', notes: ''
            });
            useEffect(() => {
                try {
                    const savedCart = sessionStorage.getItem('ecomedano_cart_v2');
                    if (savedCart) setCart(JSON.parse(savedCart));
                } catch (e) { console.warn('No se pudo restaurar el carrito:', e); }
            }, []);
            useEffect(() => {
                try { sessionStorage.setItem('ecomedano_cart_v2', JSON.stringify(cart)); } catch (e) { console.warn('No se pudo guardar el carrito:', e); }
            }, [cart]);
            const updateCartQuantity = (productId, delta) => {
                setCart(prev => prev.flatMap(item => {
                    if (item.id !== productId) return [item];
                    const nextQty = item.quantity + delta;
                    if (nextQty <= 0) return [];
                    if (item.stock !== '' && nextQty > Number(item.stock)) {
                        showToast(`Máximo disponible: ${item.stock} unidades.`);
                        return [item];
                    }
                    return [{ ...item, quantity: nextQty }];
                }));
            };
            const removeFromCart = productId => setCart(prev => prev.filter(item => item.id !== productId));
            const totalCartItems = cart.reduce((total, item) => total + Number(item.quantity || 0), 0);
            const totalCartPrice = cart.reduce((total, item) => total + Number(item.price || 0) * Number(item.quantity || 0), 0);
            const cartMeters = cart.reduce((total, item) => total + (item.category === 'manga' ? Number(item.metersPerRoll || 0) * Number(item.quantity || 0) : 0), 0);
            const WHATSAPP_NUMBER = '5492644049545';

            const normalizeText = value => String(value || '').trim();
            const openWhatsApp = text => {
                const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
                window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
            };
            const handleSmartWhatsApp = (context = 'general', product = null) => {
                if (context === 'product' && product) {
                    openWhatsApp(`¡Hola Ecomedano! Quiero consultar por *${product.name}*.` +
                        `${product.category === 'manga' ? `\n📏 Diámetro: ${product.inches}"\n📐 Rendimiento: ${product.metersPerRoll} m por rollo` : ''}` +
                        `\n💰 Precio publicado: $${Number(product.price || 0).toLocaleString('es-AR')}\n¿Me pueden asesorar con disponibilidad y entrega?`);
                    return;
                }
                if (context === 'calculator' && calcSuggestedProduct && calcRollsNeeded) {
                    openWhatsApp(`¡Hola Ecomedano! La calculadora me indicó *${calcRollsNeeded} rollos de ${calcSuggestedProduct.name}* para regar *${numericCalcMeters} m*.` +
                        `\n📐 Cubre: ${calcCoveredMeters} m\n💰 Estimado: $${calcTotal.toLocaleString('es-AR')}\nQuisiera confirmar disponibilidad y coordinar la compra.`);
                    return;
                }
                openWhatsApp('¡Hola Ecomedano! Necesito asesoramiento para elegir una manga de riego para mi finca.');
            };

            const handleCheckoutWhatsApp = () => {
                if (!cart.length) return;
                if (!normalizeText(checkoutForm.name)) { showToast('Ingresa tu Nombre y Apellido.'); return; }
                if (!normalizeText(checkoutForm.phone)) { showToast('Ingresa un número de teléfono para contactarte.'); return; }
                const itemsList = cart.map(p => {
                    const extra = p.category === 'manga' ? ` | ${p.inches}" | ${p.metersPerRoll} m/rollo` : '';
                    return `- ${p.quantity} x ${p.name}${extra} = $${(Number(p.price || 0) * Number(p.quantity || 0)).toLocaleString('es-AR')}`;
                }).join('\n');
                const text = `¡Hola Ecomedano!\nSoy *${normalizeText(checkoutForm.name)}*.\n📞 *Teléfono:* ${normalizeText(checkoutForm.phone)}\n\n📦 *MI PEDIDO:*\n${itemsList}\n\n📐 *Metros estimados de manga:* ${cartMeters || 0} m\n💰 *Total:* $${totalCartPrice.toLocaleString('es-AR')}\n📍 *Zona:* ${normalizeText(checkoutForm.zone)}\n🏠 *Dirección:* ${normalizeText(checkoutForm.address) || 'A coordinar'}\n💳 *Pago:* ${normalizeText(checkoutForm.payment)}\n📝 *Observaciones:* ${normalizeText(checkoutForm.notes) || 'Sin observaciones'}\n\nAguardo confirmación para coordinar la entrega.`;
                openWhatsApp(text);
            };

            // =========================
            // ADMINISTRACIÓN
            // =========================
            const ADMIN_PIN_FALLBACK = '1243';
            const getAdminPin = () => adminPin || ADMIN_PIN_FALLBACK;
            const [newAdminPin, setNewAdminPin] = useState('');

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (Date.now() < adminLockedUntil) {
                    showToast(`Acceso bloqueado temporalmente. Intenta nuevamente en ${Math.ceil((adminLockedUntil - Date.now()) / 1000)} s.`);
                    return;
                }
                if (pinInput === getAdminPin()) {
                    setIsAdminMode(true);
                    setAdminSessionStarted(Date.now());
                    setShowAuthModal(false);
                    setPinInput(''); setPinError(false); setAdminAttempts(0);
                    showToast('Sesión administrativa iniciada.');
                } else {
                    const nextAttempts = adminAttempts + 1;
                    setAdminAttempts(nextAttempts);
                    setPinError(true);
                    if (nextAttempts >= 5) {
                        setAdminLockedUntil(Date.now() + 30 * 1000);
                        setAdminAttempts(0);
                        showToast('Demasiados intentos. Acceso bloqueado durante 30 segundos.');
                    }
                }
            };
            const logoutAdmin = () => {
                setIsAdminMode(false);
                setAdminSessionStarted(0);
                setEditingProduct(null);
                showToast('Sesión administrativa cerrada.');
            };

            const [newProdCategory, setNewProdCategory] = useState('manga');
            const [newProdName, setNewProdName] = useState('');
            const [newProdDesc, setNewProdDesc] = useState('');
            const [newProdPrice, setNewProdPrice] = useState('');
            const [newProdImg, setNewProdImg] = useState('');
            const [newProdInches, setNewProdInches] = useState('');
            const [newProdMeters, setNewProdMeters] = useState('50');
            const [newProdStock, setNewProdStock] = useState('');
            const [editingProduct, setEditingProduct] = useState(null);
            const [adminCatalogFilter, setAdminCatalogFilter] = useState('all');

            const readImageAsDataUrl = (file, callback) => {
                if (!file) return;
                if (!file.type.startsWith('image/')) { showToast('Selecciona un archivo de imagen válido.'); return; }
                if (file.size > 800 * 1024) { showToast('La imagen es demasiado grande. Usa una de hasta 800 KB.'); return; }
                const reader = new FileReader();
                reader.onloadend = () => callback(reader.result);
                reader.onerror = () => showToast('No se pudo leer la imagen.');
                reader.readAsDataURL(file);
            };
            const handleImageUpload = e => readImageAsDataUrl(e.target.files?.[0], setNewProdImg);
            const handleEditImageUpload = e => readImageAsDataUrl(e.target.files?.[0], result => setEditingProduct(prev => prev ? ({ ...prev, img: result }) : prev));

            const handleAddProduct = e => {
                e.preventDefault();
                const name = normalizeText(newProdName);
                const price = Number(newProdPrice);
                const stock = Number(newProdStock);
                if (!name || !Number.isFinite(price) || price <= 0 || !Number.isFinite(stock) || stock < 0) {
                    showToast('Completa nombre, precio y stock con valores válidos.'); return;
                }
                if (newProdCategory === 'manga' && (!newProdInches || Number(newProdInches) <= 0 || !newProdMeters || Number(newProdMeters) <= 0)) {
                    showToast('Para una manga debes indicar diámetro y metros por rollo.'); return;
                }
                const newProduct = {
                    id: Date.now(), category: newProdCategory, name, description: normalizeText(newProdDesc),
                    price, inches: newProdCategory === 'manga' ? String(newProdInches) : '',
                    metersPerRoll: newProdCategory === 'manga' ? Number(newProdMeters) : 0,
                    stock, img: normalizeText(newProdImg) || 'https://images.unsplash.com/photo-1464226184884-fa280b87c399?auto=format&fit=crop&w=900&q=80',
                    clicks: 0, isHidden: false
                };
                setProducts(prev => {
                    const next = [...prev, newProduct];
                    try { localStorage.setItem('ecomedano_products_v6', JSON.stringify(next)); } catch {}
                    return next;
                });
                writeProductCreate(newProduct);
                setNewProdName(''); setNewProdDesc(''); setNewProdPrice(''); setNewProdImg(''); setNewProdInches(''); setNewProdStock(''); setNewProdMeters('50');
                showToast(newProdCategory === 'manga' ? 'Manga agregada correctamente.' : 'Accesorio agregado correctamente.');
            };

            const handleSaveEdit = e => {
                e.preventDefault();
                if (!editingProduct) return;
                if (!normalizeText(editingProduct.name) || Number(editingProduct.price) <= 0 || Number(editingProduct.stock) < 0) {
                    showToast('Revisa nombre, precio y stock.'); return;
                }
                if (editingProduct.category === 'manga' && (Number(editingProduct.metersPerRoll) <= 0 || Number(editingProduct.inches) <= 0)) {
                    showToast('Una manga debe tener diámetro y rendimiento válidos.'); return;
                }
                const cleanedProduct = {
                    ...editingProduct,
                    name: normalizeText(editingProduct.name),
                    description: normalizeText(editingProduct.description),
                    price: Number(editingProduct.price), stock: Number(editingProduct.stock),
                    metersPerRoll: editingProduct.category === 'manga' ? Number(editingProduct.metersPerRoll) : 0,
                    inches: editingProduct.category === 'manga' ? String(editingProduct.inches || '') : ''
                };
                updateLocalProduct(editingProduct.id, cleanedProduct);
                writeProductPatch(editingProduct.id, cleanedProduct);
                setEditingProduct(null);
                showToast('Producto actualizado correctamente.');
            };
            const handleDeleteProduct = id => {
                const target = products.find(p => p.id === id);
                if (!target) return;
                if (window.confirm(`¿Eliminar definitivamente “${target.name}”?`)) {
                    setProducts(prev => {
                        const next = prev.filter(p => p.id !== id);
                        try { localStorage.setItem('ecomedano_products_v6', JSON.stringify(next)); } catch {}
                        return next;
                    });
                    writeProductDelete(id);
                    setCart(prev => prev.filter(c => c.id !== id));
                    showToast('Producto eliminado.');
                }
            };
            const handleToggleVisibility = (id) => {
                const current = products.find(p => p.id === id);
                if (!current) return;
                const isHidden = !current.isHidden;
                updateLocalProduct(id, { isHidden });
                writeProductPatch(id, { isHidden });
            };

            const handleUpdateStockDelta = (id, delta) => {
                const current = products.find(p => p.id === id);
                if (!current) return;
                const nextStock = Math.max(0, Number(current.stock || 0) + delta);
                updateLocalProduct(id, { stock: nextStock });
                if (firebaseConfig.apiKey && firebaseConfig.apiKey !== 'TU_API_KEY') {
                    cloudInventoryRef.update({
                        [`productosPorId.${String(id)}.stock`]: firebase.firestore.FieldValue.increment(delta),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }).catch(e => {
                        console.error('Error actualizando stock:', e);
                        setCloudStatus(e?.code === 'permission-denied' ? 'permission-denied' : 'error');
                        setCloudError(e?.message || 'No se pudo actualizar el stock en Firebase.');
                        showToast('No se pudo actualizar el stock en Firebase.');
                    });
                }
            };

            const handleDirectStockUpdate = (id, value) => {
                const stock = value === '' ? '' : Math.max(0, Number(value) || 0);
                updateLocalProduct(id, { stock });
                writeProductPatch(id, { stock });
            };

            const handleStockBlur = (id, value) => {
                const stock = value === '' || !Number.isFinite(Number(value)) ? 0 : Math.max(0, Number(value));
                updateLocalProduct(id, { stock });
                writeProductPatch(id, { stock });
            };

            const handleDescriptionUpdate = (id, value) => {
                updateLocalProduct(id, { description: value });
                writeProductPatch(id, { description: value });
            };

            const topProducts = useMemo(() => [...visibleProducts].filter(p => Number(p.clicks || 0) > 0).sort((a, b) => Number(b.clicks || 0) - Number(a.clicks || 0)).slice(0, 3), [visibleProducts]);
            const adminVisibleProducts = useMemo(() => products.filter(p => adminCatalogFilter === 'all' || p.category === adminCatalogFilter), [products, adminCatalogFilter]);
            const adminStats = useMemo(() => ({
                total: products.length,
                visible: products.filter(p => !p.isHidden).length,
                hidden: products.filter(p => p.isHidden).length,
                stockZero: products.filter(p => p.stock !== '' && Number(p.stock) <= 0).length,
                mangas: products.filter(p => p.category === 'manga').length,
                accessories: products.filter(p => p.category === 'otro').length,
                clicks: products.reduce((n, p) => n + Number(p.clicks || 0), 0),
                inventoryValue: products.reduce((n, p) => n + Number(p.price || 0) * Math.max(0, Number(p.stock || 0)), 0)
            }), [products]);

            const saveNewAdminPin = async () => {
                const value = normalizeText(newAdminPin);
                if (!/^\d{4,8}$/.test(value)) { showToast('El nuevo PIN debe tener entre 4 y 8 dígitos.'); return; }
                setAdminPin(value);
                try { localStorage.setItem('ecomedano_admin_pin', value); } catch (e) { console.error(e); }
                if (firebaseConfig.apiKey && firebaseConfig.apiKey !== 'TU_API_KEY') {
                    try {
                        await cloudSettingsRef.set({ adminPin: value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                    } catch (e) {
                        console.error('Error sincronizando PIN:', e);
                        showToast('No se pudo sincronizar el PIN con la nube.');
                        return;
                    }
                }
                setNewAdminPin('');
                showToast('PIN actualizado y sincronizado.');
            };

            // =========================
            // VISTA ADMINISTRATIVA
            // =========================
            if (isAdminMode) {
                return (
                    <div className="min-h-screen bg-[#f4f7f5] font-sans text-slate-800">
                        <header className="bg-gradient-to-r from-[#062b18] via-[#0b4b2a] to-[#14532d] text-white p-4 md:p-6 shadow-xl sticky top-0 z-40">
                            <div className="max-w-7xl mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
                                <div className="flex items-center gap-3 w-full lg:w-auto">
                                    <div className="p-3 bg-white/10 rounded-2xl border border-white/10"><IconSettings className="w-6 h-6 text-emerald-200" /></div>
                                    <div><h2 className="text-xl md:text-2xl font-black">Panel de Control</h2><p className="text-xs text-emerald-100/70">Administración Ecomedano · sesión protegida</p></div>
                                </div>
                                <div className="flex flex-col sm:flex-row gap-2 w-full lg:w-auto">
                                    <button type="button" onClick={logoutAdmin} className="w-full sm:w-auto bg-white/10 hover:bg-white/20 px-5 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2"><IconClose className="w-4 h-4" /> Cerrar sesión</button>
                                    <button type="button" onClick={() => setIsAdminMode(false)} className="w-full sm:w-auto bg-white text-primary hover:bg-emerald-50 px-5 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2"><IconExternalLink className="w-4 h-4" /> Ver tienda</button>
                                </div>
                            </div>
                        </header>
                        <div className={`max-w-7xl mx-auto px-4 md:px-6 pt-4 ${cloudStatus === 'online' ? '' : ''}`}>
                            <div className={`rounded-2xl border px-4 py-3 text-sm font-bold flex items-center justify-between gap-3 ${cloudStatus === 'online' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : cloudStatus === 'permission-denied' ? 'bg-red-50 border-red-200 text-red-800' : cloudStatus === 'connecting' ? 'bg-amber-50 border-amber-200 text-amber-800' : 'bg-orange-50 border-orange-200 text-orange-800'}`}>
                                <div><span className="mr-2">{cloudStatus === 'online' ? '●' : '●'}</span>{cloudStatus === 'online' ? 'Firebase conectado · sincronización en tiempo real activa' : cloudStatus === 'permission-denied' ? 'Firebase rechazó el acceso. Las modificaciones NO se están guardando en la nube.' : cloudStatus === 'connecting' ? 'Conectando con Firebase…' : 'Firebase está con problemas de conexión o configuración.'}</div>
                                {cloudError && <span className="text-xs opacity-80 hidden md:block max-w-[50%] truncate" title={cloudError}>{cloudError}</span>}
                            </div>
                        </div>

                        <main className="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
                            <section className="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
                                {[['Productos', adminStats.total], ['Visibles', adminStats.visible], ['Sin stock', adminStats.stockZero], ['Interacciones', adminStats.clicks]].map(([label, value]) => (
                                    <div key={label} className="bg-white rounded-2xl p-4 md:p-5 border border-slate-200 shadow-sm"><p className="text-xs uppercase tracking-widest text-slate-400 font-black">{label}</p><p className="text-2xl md:text-3xl font-black text-slate-900 mt-1">{value}</p></div>
                                ))}
                            </section>

                            <section className="grid grid-cols-1 xl:grid-cols-3 gap-6">
                                <div className="xl:col-span-1 space-y-6">
                                    <div className="bg-white rounded-3xl shadow-sm p-5 md:p-6 border border-slate-200">
                                        <div className="flex items-center justify-between mb-5"><div><p className="text-xs uppercase tracking-widest text-primary font-black">Catálogo</p><h3 className="font-black text-xl">Agregar producto</h3></div><IconPackage className="w-6 h-6 text-primary" /></div>
                                        <div className="grid grid-cols-2 gap-2 p-1.5 bg-slate-100 rounded-xl mb-5">
                                            <button type="button" onClick={() => setNewProdCategory('manga')} className={`py-2.5 rounded-lg font-black text-sm ${newProdCategory === 'manga' ? 'bg-primary text-white shadow' : 'text-slate-500'}`}>Manga</button>
                                            <button type="button" onClick={() => setNewProdCategory('otro')} className={`py-2.5 rounded-lg font-black text-sm ${newProdCategory === 'otro' ? 'bg-orange-500 text-white shadow' : 'text-slate-500'}`}>Accesorio</button>
                                        </div>
                                        <form onSubmit={handleAddProduct} className="space-y-4">
                                            <input value={newProdName} onChange={e => setNewProdName(e.target.value)} className="admin-input" placeholder={newProdCategory === 'manga' ? 'Manga de 10 pulgadas' : 'Ej: Accesorio de riego'} required />
                                            <textarea value={newProdDesc} onChange={e => setNewProdDesc(e.target.value)} className="admin-input min-h-24 resize-y" placeholder="Descripción del producto"></textarea>
                                            {newProdCategory === 'manga' && <div className="grid grid-cols-2 gap-3"><input type="number" min="1" value={newProdInches} onChange={e => setNewProdInches(e.target.value)} className="admin-input" placeholder="Diámetro (pulg.)" required /><input type="number" min="1" value={newProdMeters} onChange={e => setNewProdMeters(e.target.value)} className="admin-input" placeholder="Metros/rollo" required /></div>}
                                            <div className="grid grid-cols-2 gap-3"><input type="number" min="0" step="0.01" value={newProdPrice} onChange={e => setNewProdPrice(e.target.value)} className="admin-input" placeholder="Precio ($)" required /><input type="number" min="0" value={newProdStock} onChange={e => setNewProdStock(e.target.value)} className="admin-input" placeholder="Stock" required /></div>
                                            <input value={newProdImg} onChange={e => setNewProdImg(e.target.value)} className="admin-input" placeholder="URL de imagen (opcional)" />
                                            <label className="flex items-center justify-center gap-2 py-3 border border-dashed border-slate-300 rounded-xl bg-slate-50 hover:bg-slate-100 cursor-pointer font-bold text-sm text-slate-600"><IconUpload className="w-4 h-4" /> Subir imagen<input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" /></label>
                                            {newProdImg && <img src={newProdImg} alt="Vista previa" className="w-full h-28 object-cover rounded-xl border border-slate-200" />}
                                            <button className="w-full py-3.5 rounded-xl bg-primary hover:bg-primaryLight text-white font-black shadow-lg">Guardar {newProdCategory === 'manga' ? 'manga' : 'accesorio'}</button>
                                        </form>
                                    </div>

                                    <div className="bg-white rounded-3xl shadow-sm p-5 md:p-6 border border-slate-200">
                                        <div className="flex items-center gap-3 mb-5"><div className="p-2.5 bg-amber-50 text-amber-600 rounded-xl"><IconStar className="w-5 h-5" /></div><div><p className="text-xs uppercase tracking-widest text-slate-400 font-black">Visibilidad</p><h3 className="font-black text-xl">Marketing</h3></div></div>
                                        {[
                                            ['Destacados', 'Muestra la sección de productos populares.', showBestSellers, toggleBest],
                                            ['Calculadora de riego', 'Permite ocultarla completamente del sitio.', showCalculator, toggleCalculator],
                                            ['¿Por qué elegir Ecomedano?', 'Muestra la sección de confianza y ventajas.', showWhy, toggleWhy]
                                        ].map(([label, desc, value, action]) => (
                                            <button type="button" key={label} onClick={action} className="w-full flex items-center justify-between gap-4 text-left bg-slate-50 hover:bg-emerald-50 p-4 rounded-2xl border border-slate-200 mb-3 last:mb-0">
                                                <span className="pr-4"><span className="font-black block">{label}</span><span className="text-xs text-slate-500">{desc}</span></span>
                                                <span className={`w-14 h-8 rounded-full p-1 shrink-0 ${value ? 'bg-secondary' : 'bg-slate-300'}`}><span className={`block w-6 h-6 rounded-full bg-white shadow transition-transform ${value ? 'translate-x-6' : ''}`}></span></span>
                                            </button>
                                        ))}
                                    </div>

                                    <div className="bg-white rounded-3xl shadow-sm p-5 md:p-6 border border-slate-200">
                                        <p className="text-xs uppercase tracking-widest text-slate-400 font-black">Seguridad</p><h3 className="font-black text-xl mb-2">Protección del panel</h3>
                                        <p className="text-sm text-slate-500 mb-4">Sesión automática de 30 minutos y bloqueo temporal tras 5 intentos fallidos.</p>
                                        <div className="flex gap-2"><input type="password" inputMode="numeric" maxLength="8" value={newAdminPin} onChange={e => setNewAdminPin(e.target.value.replace(/\D/g, ''))} className="admin-input" placeholder="Nuevo PIN" /><button type="button" onClick={saveNewAdminPin} className="px-4 rounded-xl bg-slate-900 text-white font-black">Cambiar</button></div>
                                        <p className="text-xs text-amber-700 bg-amber-50 border border-amber-100 rounded-xl p-3 mt-3">Para seguridad real en producción, protege además Firestore con Firebase Authentication y reglas de acceso. El PIN del frontend por sí solo no puede considerarse una barrera criptográfica.</p>
                                    </div>
                                </div>

                                <div className="xl:col-span-2 space-y-6">
                                    <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="p-5 md:p-6 border-b border-slate-200 flex flex-col md:flex-row gap-3 md:items-center md:justify-between"><div><p className="text-xs uppercase tracking-widest text-primary font-black">Inventario</p><h3 className="font-black text-xl">Gestión de productos</h3></div><div className="flex gap-2"><button type="button" onClick={() => setAdminCatalogFilter('all')} className={`px-3 py-2 rounded-lg text-sm font-black ${adminCatalogFilter === 'all' ? 'bg-primary text-white' : 'bg-slate-100'}`}>Todos</button><button type="button" onClick={() => setAdminCatalogFilter('manga')} className={`px-3 py-2 rounded-lg text-sm font-black ${adminCatalogFilter === 'manga' ? 'bg-primary text-white' : 'bg-slate-100'}`}>Mangas</button><button type="button" onClick={() => setAdminCatalogFilter('otro')} className={`px-3 py-2 rounded-lg text-sm font-black ${adminCatalogFilter === 'otro' ? 'bg-orange-500 text-white' : 'bg-slate-100'}`}>Accesorios</button></div></div>
                                        <div className="divide-y divide-slate-100">
                                            {adminCatalogFilter !== 'all' && adminVisibleProducts.length === 0 && <p className="p-8 text-center text-slate-500">No hay productos en esta categoría.</p>}
                                            {adminVisibleProducts.map(p => (
                                                <div key={p.id} className={`p-4 md:p-5 ${p.isHidden ? 'bg-slate-50 opacity-75' : 'bg-white'}`}>
                                                    <div className="flex flex-col lg:flex-row gap-4 lg:items-center lg:justify-between">
                                                        <div className="flex items-center gap-3 min-w-0"><img src={p.img} alt={p.name} className="w-16 h-16 md:w-20 md:h-20 rounded-2xl object-cover border border-slate-200 shrink-0" /><div className="min-w-0"><h4 className="font-black truncate">{p.name}</h4><p className="text-primary font-black">${Number(p.price || 0).toLocaleString('es-AR')}</p><div className="flex flex-wrap gap-2 mt-1"><span className={`text-xs font-black px-2 py-1 rounded-lg ${p.category === 'manga' ? 'bg-emerald-100 text-emerald-700' : 'bg-orange-100 text-orange-700'}`}>{p.category === 'manga' ? `Manga ${p.inches}"` : 'Accesorio'}</span>{p.category === 'manga' && <span className="text-xs bg-slate-100 px-2 py-1 rounded-lg">{p.metersPerRoll} m/rollo</span>}<span className="text-xs bg-slate-100 px-2 py-1 rounded-lg">{p.clicks || 0} interacciones</span>{p.isHidden && <span className="text-xs bg-red-100 text-red-700 px-2 py-1 rounded-lg font-black">Oculto</span>}</div></div></div>
                                                        <div className="flex flex-wrap items-center gap-2"><div className="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-xl p-1"><button type="button" onClick={() => handleUpdateStockDelta(p.id, -1)} className="p-2 rounded-lg hover:bg-white"><IconMinus className="w-4 h-4" /></button><input type="number" value={p.stock} onChange={e => handleDirectStockUpdate(p.id, e.target.value)} onBlur={e => handleStockBlur(p.id, e.target.value)} className="w-16 text-center bg-transparent font-black outline-none" /><button type="button" onClick={() => handleUpdateStockDelta(p.id, 1)} className="p-2 rounded-lg hover:bg-white"><IconPlus className="w-4 h-4" /></button></div><button type="button" onClick={() => setEditingProduct({...p})} className="p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50" title="Editar"><IconEdit className="w-5 h-5" /></button><button type="button" onClick={() => handleToggleVisibility(p.id)} className="p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-blue-600" title={p.isHidden ? 'Mostrar' : 'Ocultar'}>{p.isHidden ? <IconEyeOff className="w-5 h-5" /> : <IconEye className="w-5 h-5" />}</button><button type="button" onClick={() => handleDeleteProduct(p.id)} className="p-2.5 rounded-xl border border-red-100 hover:bg-red-50 text-red-600" title="Eliminar"><IconTrash className="w-5 h-5" /></button></div>
                                                    </div>
                                                    <textarea value={p.description || ''} onChange={e => handleDescriptionUpdate(p.id, e.target.value)} className="admin-input mt-3 min-h-20 resize-y text-sm" placeholder="Descripción del producto"></textarea>
                                                </div>
                                            ))}
                                            {!adminVisibleProducts.length && <p className="p-8 text-center text-slate-500">No hay productos cargados.</p>}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="bg-white rounded-3xl shadow-sm p-5 md:p-6 border border-slate-200"><p className="text-xs uppercase tracking-widest text-slate-400 font-black">Estadísticas</p><h3 className="font-black text-xl mb-4">Resumen del negocio</h3><div className="space-y-3 text-sm"><div className="flex justify-between"><span>Valor de inventario publicado</span><strong>${adminStats.inventoryValue.toLocaleString('es-AR')}</strong></div><div className="flex justify-between"><span>Mangas</span><strong>{adminStats.mangas}</strong></div><div className="flex justify-between"><span>Accesorios</span><strong>{adminStats.accessories}</strong></div><div className="flex justify-between"><span>Ocultos</span><strong>{adminStats.hidden}</strong></div></div></div>
                                        <div className="bg-white rounded-3xl shadow-sm p-5 md:p-6 border border-slate-200"><p className="text-xs uppercase tracking-widest text-slate-400 font-black">Productos populares</p><h3 className="font-black text-xl mb-4">Top 3</h3>{topProducts.length ? <div className="space-y-3">{topProducts.map((p, i) => <div key={p.id} className="flex items-center gap-3"><span className="w-7 h-7 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center font-black text-sm">{i + 1}</span><div className="min-w-0"><p className="font-bold truncate">{p.name}</p><p className="text-xs text-slate-500">{p.clicks || 0} interacciones</p></div></div>)}</div> : <p className="text-sm text-slate-500">Aún no hay suficientes interacciones.</p>}</div>
                                    </div>
                                </div>
                            </section>
                        </main>

                        {editingProduct && (

abled:text-slate-400 text-white font-black flex items-center justify-center gap-2"><IconCart className="w-5 h-5" /> Añadir al carrito</button><button type="button" onClick={() => handleSmartWhatsApp('calculator')} className="flex-1 py-3.5 rounded-xl bg-[#25D366] hover:bg-[#20bd5a] text-white font-black flex items-center justify-center gap-2"><IconWhatsApp className="w-5 h-5" /> Consultar resultado</button></div></div></div></div></div></section>}
